name: Publish MindDial AI static website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare website
        run: |
          mkdir -p _site
          cp static/mindy.html _site/index.html
          cp static/mindy.html _site/mindy.html
          cp static/browser.html _site/browser.html
          cp static/index.html _site/demo.html
          cp static/evaluator.js _site/evaluator.js
          cp -r models _site/models
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
